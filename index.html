<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasty! Bean Coffee Co.</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #120d0b;
  color: #f7efe6;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
}

.logo {
  font-size: 24px;
  font-weight: 800;
}

.logo span {
  color: #ff4d6d;
}

.hero {
  padding: 80px 20px;
}

.hero h1 {
  font-size: 48px;
  line-height: 1.1;
}

.hero span {
  color: #ff4d6d;
}

.btn {
  padding: 12px 24px;
  border-radius: 30px;
  border: none;
  margin-right: 10px;
  cursor: pointer;
}

.btn-primary {
  background: #f7efe6;
  color: #1a120e;
}

.btn-secondary {
  background: transparent;
  border: 1px solid #f7efe6;
  color: #f7efe6;
}

.section {
  padding: 60px 0;
}

.grid {
  display: grid;
  gap: 20px;
}

.grid-3 {
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}

.card {
  background: #1e1612;
  padding: 20px;
  border-radius: 20px;
}

.product {
  background: #19110e;
  border-radius: 20px;
  overflow: hidden;
}

.product-top {
  padding: 20px;
  color: white;
}

.product-bottom {
  padding: 20px;
}

.price {
  font-weight: bold;
}

.footer {
  padding: 40px;
  border-top: 1px solid #333;
  text-align: center;
  color: #aaa;
}
</style>
</head>

<body>

<header class="container">
  <div class="logo">Tasty<span>!</span> Bean</div>
  <div>Cart (0)</div>
</header>

<section class="hero container">
  <h1>Coffee with a <span>cheeky mouth</span> and a premium finish.</h1>
  <p>Flirty branding. Serious coffee. Built to stand out and sell out.</p>
  <br>
  <button class="btn btn-primary">Shop Best Sellers</button>
  <button class="btn btn-secondary">Take Quiz</button>
</section>

<section class="section container">
  <h2>Collections</h2>
  <div class="grid grid-3">

      <h3>After Dark</h3>
      <p>Seductive dark roasts with bold flavor.</p>
    </div>

      <h
